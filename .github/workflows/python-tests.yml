name: Python tests

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: packages/python/src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install "numpy>=1.26,<3" "plotly>=6,<7"

      - name: Run Python unit tests
        run: |
          if python -m unittest discover -s tests/python -p 'test_*.py' -v; then
            exit 0
          else
            status=$?
            if [ "$status" -ne 5 ]; then
              exit "$status"
            fi
            echo "No Python tests discovered yet; treating the empty suite as successful."
          fi
